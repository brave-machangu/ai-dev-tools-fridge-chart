[project]
name = "ai-dev-tools-homework"
version = "0.1.0"
description = "Family chore and reward manager"
readme = "README.md"
authors = [
    { name = "Matipa Brave Machangu", email = "325657687+brave-machangu@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "reportlab>=5.0.1",
]

# Only needed to run against PostgreSQL: uv sync --extra postgres
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

# Not a distributable package: the Django project lives at the repository root,
# so uv only manages dependencies here.
[tool.uv]
package = false
